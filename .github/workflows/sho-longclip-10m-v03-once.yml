name: Sho quality-v03 10-minute encrypted research ONE SHOT

"on":
  push:
    branches: [master]
    paths:
      - .github/workflows/sho-longclip-10m-v03-once.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: sho-10m-v03-free-20261123-single-run
  cancel-in-progress: false

jobs:
  seal_10min:
    if: github.repository == 'reiji328/sho-investment-research' && github.event.before == 'ab79e50473345820ff6ea595627ee331e0226c82' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout public source without cached credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Offline validation and one-use encryption certificate check
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/sho_longclip_relay_v03.py
          python3 -m unittest discover -s tests -p test_sho_longclip_relay_v03.py -v
          openssl x509 -in certs/sho-relay-20261123-longclip-v03-10m.crt -noout -checkend 0
          echo 'cd4c4913b8c1f4e6627fe08af2c09c5b2afad891b9b6fdcfc247ed47348441e7  certs/sho-relay-20261123-longclip-v03-10m.crt' | sha256sum -c -

      - name: Verify Gemini secret exists before request
        env:
          HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [[ "$HAS_KEY" != "true" ]]; then
            echo 'No Gemini secret; request not sent.'
            exit 1
          fi

      - name: Download verified video catalog and check video identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 44967026981 --repo "$GITHUB_REPOSITORY" \
            --name sho-youtube-catalog-44967026981 --dir "$RUNNER_TEMP/catalog"
          python3 -c 'import sys; from scripts.sho_longclip_relay_v03 import check_catalog; check_catalog(sys.argv[1]); print("Exact video metadata verified.")' "$RUNNER_TEMP/catalog/videos.json"

      - name: Send exactly one 10-minute Gemini request and seal response
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sealed"
          python3 scripts/sho_longclip_relay_v03.py \
            --clip 10m \
            --catalog "$RUNNER_TEMP/catalog/videos.json" \
            --certificate certs/sho-relay-20261123-longclip-v03-10m.crt \
            --output-dir "$RUNNER_TEMP/sealed" \
            --execute

      - name: Upload encrypted body and safe manifest only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sho-encrypted-v03-10m-20261123
          path: ${{ runner.temp }}/sealed/
          retention-days: 3
          if-no-files-found: error
