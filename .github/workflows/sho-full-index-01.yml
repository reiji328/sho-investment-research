name: Sho full video one-shot topic index

"on":
  push:
    branches: [master]
    paths:
      - .github/workflows/sho-full-index-01.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: sho-full-index-01
  cancel-in-progress: false

jobs:
  index:
    if: github.repository == 'reiji328/sho-investment-research' && github.event.before == '700aaa614927bfda784e57c7e34cf8e587c51fa3' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test full video index offline
        run: |
          python3 -m unittest discover -s tests -p 'test_sho_full_index_01.py' -v

      - name: Verify Gemini key
        env:
          HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [[ "$HAS_KEY" != "true" ]]; then
            echo 'Secret missing; no video sent.'
            exit 1
          fi

      - name: Load latest successful approved catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/collect.yml/runs?branch=master&status=success&per_page=30"
          run_id=$(gh api "$endpoint" | jq -er --arg repo "$GITHUB_REPOSITORY" '
            first(.workflow_runs[] | select(
              .head_repository.full_name == $repo and
              .path == ".github/workflows/collect.yml" and
              (.event == "schedule" or .event == "workflow_dispatch")
            ) | .id)')
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "sho-youtube-catalog-$run_id" --dir "$RUNNER_TEMP/catalog"
          python3 -c 'import sys; from scripts.sho_full_index_01 import check_catalog; check_catalog(sys.argv[1]); print("Approved video catalog verified.")' "$RUNNER_TEMP/catalog/videos.json"

      - name: Submit the one full-video request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/sho_full_index_01.py \
            --catalog "$RUNNER_TEMP/catalog/videos.json" \
            --output "$RUNNER_TEMP/full_index_01.json"

      - name: Save public-approved topic index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sho-full-index-01
          path: ${{ runner.temp }}/full_index_01.json
          retention-days: 21
          if-no-files-found: error
