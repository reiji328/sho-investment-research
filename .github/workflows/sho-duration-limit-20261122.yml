name: Sho video duration limit comparison (one shot)

"on":
  push:
    branches: [master]
    paths:
      - .github/workflows/sho-duration-limit-20261122.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: sho-duration-limit-20261122
  cancel-in-progress: false

jobs:
  compare:
    if: github.repository == 'reiji328/sho-investment-research' && github.event.before == 'def901f875b5d262445c2be2ffe58ba490e1b1f2' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test comparison logic offline
        run: python3 -m unittest discover -s tests -p 'test_sho_duration_probe.py' -v
      - name: Verify API key before any request
        env:
          HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [[ "$HAS_KEY" != "true" ]]; then
            echo 'Gemini key unavailable; no video sent.'
            exit 1
          fi
      - name: Retrieve verified public video catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/collect.yml/runs?branch=master&status=success&per_page=30"
          run_id=$(gh api "$endpoint" | jq -er --arg repo "$GITHUB_REPOSITORY" '
            first(.workflow_runs[] | select(
              .head_repository.full_name == $repo and
              .path == ".github/workflows/collect.yml" and
              (.event == "schedule" or .event == "workflow_dispatch")
            ) | .id)')
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "sho-youtube-catalog-$run_id" --dir "$RUNNER_TEMP/catalog"
          python3 -c 'import sys; from scripts.sho_duration_probe import check_catalog; check_catalog(sys.argv[1]); print("Approved video metadata verified.")' "$RUNNER_TEMP/catalog/videos.json"
      - name: Probe 5 then 10 then 15 minutes (max 3 calls, stop at failure)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/sho_duration_probe.py \
            --catalog "$RUNNER_TEMP/catalog/videos.json" \
            --output "$RUNNER_TEMP/duration_probe.json"
      - name: Publish safe telemetry only, even if comparison stops early
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sho-duration-probe-20261122
          path: ${{ runner.temp }}/duration_probe.json
          if-no-files-found: warn
          retention-days: 21
