name: Sho original audio TWO bounded clips 2026-11-24 ONE SHOT

"on":
  push:
    branches: [master]
    paths:
      - .github/workflows/sho-audio-evidence-dual-once-20261124.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: sho-raw-audio-evidence-20261124-one-shot
  cancel-in-progress: false

jobs:
  sealed_audio:
    if: github.repository == 'reiji328/sho-investment-research' && github.event.before == '8b1fd0744ae2c472ba73d0d0cc3dc58f3032a873' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        clip: [margin27, lending29]
    steps:
      - name: Checkout public code (no persisted auth)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run 10 synthetic tests and verify ephemeral public certificate
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_sho_audio_crosscheck_two_clips_20261124.py -v
          python3 -m py_compile scripts/sho_audio_crosscheck_two_clips_20261124.py
          openssl x509 -in certs/sho-audio-evidence-two-clips-20261124.crt -noout -checkend 0
          echo '465f56dacb971d192436ba728d26364f304fb90080337a0f408d4e6f2f9de438  certs/sho-audio-evidence-two-clips-20261124.crt' | sha256sum -c -

      - name: Confirm the previously Free Tier Gemini key exists without printing it
        env:
          HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [[ "$HAS_KEY" != "true" ]]; then echo 'Secret absent; no API request'; exit 1; fi

      - name: Download approved public catalog and validate exact video identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 44967026981 --repo "$GITHUB_REPOSITORY" \
            --name sho-youtube-catalog-44967026981 --dir "$RUNNER_TEMP/catalog"
          python3 -c 'import sys; from scripts.sho_audio_crosscheck_two_clips_20261124 import check_catalog; check_catalog(sys.argv[1]); print("Catalog identity passed.")' "$RUNNER_TEMP/catalog/videos.json"

      - name: One unscripted audio transcription only then CMS encryption
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLIP_NAME: ${{ matrix.clip }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sealed"
          python3 scripts/sho_audio_crosscheck_two_clips_20261124.py \
            --clip "$CLIP_NAME" \
            --catalog "$RUNNER_TEMP/catalog/videos.json" \
            --certificate certs/sho-audio-evidence-two-clips-20261124.crt \
            --output-dir "$RUNNER_TEMP/sealed" \
            --execute

      - name: Upload encrypted CMS and privacy-safe manifest only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sho-audio-evidence-20261124-${{ matrix.clip }}
          path: ${{ runner.temp }}/sealed/
          retention-days: 3
          if-no-files-found: error
